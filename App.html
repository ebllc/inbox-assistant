<!doctype html>
<html lang="en">
<head>
<base target="_top">
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Design B · glanceable dashboard. Dark header on Today, teal accent, cards on a cool grey ground. */
:root {
  --ground: #f3f5f5; --card: #ffffff; --line: #e1e6e6; --line-2: #edf1f1; --ink: #13201f; --muted: #55625f; --faint: #6b7a79;
  --head: #10292b; --head-ink: #e9f4f3; --head-muted: #a9c9c6; --head-line: #2f5b5d; --head-chip: #173b3d;
  --accent: #0e7c86; --accent-ink: #ffffff; --accent-soft: #e3eeee; --mint: #3fc1b0;
  --alert: #d14b2f; --alert-ink: #b4441f; --needs: #e0a100; --peach: #ffb86b; --off: #c9d4d3;
  --display: "Space Grotesk", system-ui, sans-serif; --body: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --ground: #0d1717; --card: #152222; --line: #233434; --line-2: #1c2b2b; --ink: #e4efee; --muted: #9fb3b1; --faint: #86a09d;
    --head: #0a1d1f; --head-line: #2a4c4e; --head-chip: #12302f; --accent: #3fb3bb; --accent-ink: #062224; --accent-soft: #1d3434;
    --off: #3b4f4f; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--ground); color: var(--ink); font: 15px/1.45 var(--body); -webkit-font-smoothing: antialiased; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--mint); outline-offset: 2px; }
a { color: var(--accent); }
.shell { max-width: 560px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; }
.page { flex: 1; padding: 14px 16px 96px; display: flex; flex-direction: column; gap: 14px; }
h1, h2 { font-family: var(--display); margin: 0; text-wrap: balance; }
h1 { font-size: 24px; font-weight: 700; } h2 { font-size: 16px; font-weight: 600; }
.top { padding: 18px 16px 6px; display: flex; align-items: center; gap: 8px; }
.top h1 { flex: 1; }
.back { width: 44px; height: 44px; margin-left: -10px; display: grid; place-items: center; border: 0; background: none; color: var(--ink); border-radius: 12px; }
/* Today header */
.hero { background: var(--head); color: var(--head-ink); padding: 18px 16px 16px; display: flex; flex-direction: column; gap: 14px; }
.hero .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.eyebrow { font-size: 12px; letter-spacing: .08em; color: #8fb8b5; text-transform: uppercase; }
.hero h1 { margin-top: 2px; }
.counts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.counts b { display: block; font: 700 30px/1.1 var(--display); font-variant-numeric: tabular-nums; }
.counts span { font-size: 12px; color: var(--head-muted); }
.counts .hot { color: var(--peach); }
.livebtn { min-height: 40px; border: 1px solid var(--head-line); background: var(--head-chip); color: var(--head-ink); border-radius: 999px; padding: 0 6px 0 12px; display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 13px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { min-height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--off); background: var(--card); color: var(--ink); font-size: 13px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; }
.chip[aria-pressed="true"] { background: var(--head); border-color: var(--head); color: #fff; font-weight: 600; }
.hero .chip { background: transparent; border-color: var(--head-line); color: #cfe3e1; min-height: 32px; }
.hero .chip[aria-pressed="true"] { background: var(--head-ink); color: var(--head); border-color: var(--head-ink); }
.chip.warn { border-style: dashed; }
/* switch */
.sw { width: 44px; height: 26px; border: 0; border-radius: 999px; background: var(--off); position: relative; flex: none; padding: 0; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: left .15s; }
.sw[aria-checked="true"] { background: var(--accent); }
.sw[aria-checked="true"]::after { left: 21px; }
.livebtn .sw { width: 34px; height: 20px; background: #4a6466; }
.livebtn .sw::after { width: 16px; height: 16px; top: 2px; left: 2px; }
.livebtn .sw[aria-checked="true"] { background: var(--mint); }
.livebtn .sw[aria-checked="true"]::after { left: 16px; }
/* cards */
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; }
.list { display: flex; flex-direction: column; gap: 8px; }
.need { display: flex; gap: 12px; padding: 12px 14px 12px 12px; text-align: left; width: 100%; color: inherit; }
.need .bar { width: 4px; border-radius: 2px; background: var(--needs); flex: none; }
.need.alert .bar { background: var(--alert); }
.need .meta { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; color: var(--accent); }
.need.alert .meta { color: var(--alert-ink); }
.need .meta .r { display: flex; gap: 6px; align-items: center; color: var(--faint); font-weight: 500; white-space: nowrap; }
.tag { padding: 1px 7px; border-radius: 999px; background: var(--accent-soft); color: var(--ink); font-size: 12px; font-weight: 600; }
.need .t { display: block; font-weight: 600; font-size: 15px; margin-top: 3px; }
.need .s { display: block; font-size: 13px; color: var(--muted); }
.empty { padding: 16px; text-align: center; color: var(--muted); font-size: 14px; }
.actions2 { display: flex; gap: 8px; }
.btn { min-height: 48px; border-radius: 14px; border: 1px solid var(--off); background: var(--card); font-weight: 600; font-size: 15px; padding: 0 16px; flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; color: var(--ink); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.soft { background: var(--accent-soft); border-color: var(--accent-soft); color: var(--accent); }
.btn.small { min-height: 40px; font-size: 14px; border-radius: 10px; }
.btn:disabled { opacity: .55; }
.note { font-size: 12px; color: var(--muted); text-align: center; }
/* rules */
.rule { padding: 12px 14px; display: flex; gap: 12px; align-items: flex-start; }
.rule .k { font-size: 12px; font-weight: 600; color: var(--accent); text-transform: uppercase; letter-spacing: .02em; }
.rule .x { font-size: 14px; line-height: 1.4; }
.rule.off { color: var(--faint); } .rule.off .k { color: var(--faint); }
.linkbtn { border: 0; background: none; color: var(--accent); font-weight: 600; font-size: 13px; padding: 4px 0; }
.addbtn { min-height: 36px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--off); background: var(--card); font-weight: 600; font-size: 13px; flex: none; }
.addbtn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent-soft); color: var(--accent); }
/* settings */
.group { overflow: hidden; }
.item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--line-2); }
.item:last-child { border-bottom: 0; }
.item .lbl { flex: 1; min-width: 0; } .item .lbl b { display: block; font-weight: 600; } .item .lbl span { font-size: 13px; color: var(--muted); }
.block { padding: 12px 14px; border-bottom: 1px solid var(--line-2); }
.block:last-child { border-bottom: 0; }
.seg { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); background: var(--accent-soft); border-radius: 10px; padding: 3px; margin-top: 8px; }
.seg button { min-height: 36px; border: 0; border-radius: 8px; background: transparent; color: var(--muted); font-size: 13px; font-weight: 500; }
.seg button[aria-checked="true"] { background: var(--card); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(16,41,43,.15); }
.stepper { display: flex; align-items: center; border: 1px solid var(--off); border-radius: 10px; }
.stepper button { width: 40px; height: 40px; border: 0; background: none; font-weight: 600; font-size: 18px; }
.stepper span { min-width: 58px; text-align: center; font-weight: 600; font-size: 14px; font-variant-numeric: tabular-nums; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none; }
.dot.bad { background: var(--alert); }
/* forms */
label.f { font-size: 14px; font-weight: 600; display: block; margin-bottom: 6px; }
.input, textarea.input { width: 100%; border: 1px solid var(--off); border-radius: 12px; padding: 12px; background: var(--card); font-size: 15px; }
textarea.input { resize: vertical; min-height: 110px; line-height: 1.5; }
.input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
/* link code */
.codecard { background: var(--head); color: var(--head-ink); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 10px; }
.code { font: 700 40px var(--display); letter-spacing: .12em; font-variant-numeric: tabular-nums; }
/* email */
.mail { padding: 14px; font-size: 15px; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; }
.avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--head); color: var(--head-ink); display: grid; place-items: center; font-weight: 600; flex: none; }
.dock { position: sticky; bottom: 0; background: var(--card); border-top: 1px solid var(--line); padding: 12px 16px calc(14px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 8px; }
.three { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.three .btn { flex-direction: column; gap: 2px; font-size: 14px; min-height: 52px; }
/* nav */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line); padding: 6px 0 calc(10px + env(safe-area-inset-bottom, 0px)); }
nav.tabs .in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
nav.tabs button { border: 0; background: none; min-height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 500; color: var(--muted); }
nav.tabs button[aria-current="page"] { color: var(--accent); font-weight: 600; }
#toast { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); background: var(--head); color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 14px; max-width: calc(100% - 32px); box-shadow: 0 6px 20px rgba(0,0,0,.25); z-index: 20; }
.loading { padding: 60px 16px; text-align: center; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="shell" id="app"><div class="loading">Loading your inbox…</div></div>
<div id="toast" role="status" hidden></div>
<script>
var S = { view: 'all', tab: 'today', sub: null, d: null, filter: 'active', cleared: null, email: null, link: null, edit: null, joinMsg: '' };

function call(name) {
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (res, rej) {
    var r = google.script.run.withSuccessHandler(res).withFailureHandler(function (e) { rej(e && e.message ? e : new Error(String(e))); });
    r.appCall(name, args);
  });
}
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function toast(msg) { var t = document.getElementById('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(function () { t.hidden = true; }, 3500); }
function fail(e) { toast(e && e.message ? e.message : 'Something went wrong.'); }
function when(iso) {
  if (!iso) return '';
  var d = new Date(iso), now = new Date(), y = new Date(now); y.setDate(now.getDate() - 1);
  if (d.toDateString() === now.toDateString()) return d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  if (d.toDateString() === y.toDateString()) return 'Yesterday';
  return d.toLocaleDateString([], { weekday: 'short' });
}
function hourLabel(h) { return h === 0 ? '12 AM' : h < 12 ? h + ' AM' : h === 12 ? '12 PM' : (h - 12) + ' PM'; }
var I = {
  today: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>',
  rules: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>',
  settings: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>',
  back: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>',
  plus: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
  check: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>',
  box: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v11h14V8M10 12h4"/></svg>',
  star: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3l2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3 6.4 20.2l1.1-6.2L3 9.6l6.2-.9z"/></svg>',
  out: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M7 17L17 7M8 7h9v9"/></svg>'
};

function load(view) {
  if (view) S.view = view;
  return call('appState', S.view).then(function (d) { S.d = d; render(); }).catch(function (e) {
    document.getElementById('app').innerHTML = '<div class="loading">Couldn\'t load: ' + esc(e.message) + '<br><br><button class="btn small" onclick="load()">Try again</button></div>';
  });
}
function loadAcct(i) { var a = S.d.accounts[i]; if (a) load(a.key); }
function catList() { return Object.keys(S.d.cleared).sort(); }
function multi() { return S.d && S.d.accounts.length > 1; }

function render() {
  var d = S.d, html = '';
  if (S.sub === 'email') html = viewEmail();
  else if (S.sub === 'write') html = viewWrite();
  else if (S.sub === 'cleared') html = viewCleared();
  else if (S.sub === 'link') html = viewLink();
  else if (S.sub === 'join') html = viewJoin();
  else if (S.sub === 'manage') html = viewManage();
  else if (S.sub === 'key') html = viewKey();
  else if (S.tab === 'rules') html = viewRules();
  else if (S.tab === 'settings') html = viewSettings();
  else html = viewToday();
  if (!S.sub || S.sub === 'cleared' || S.sub === 'link' || S.sub === 'join' || S.sub === 'manage' || S.sub === 'key') html += nav();
  document.getElementById('app').innerHTML = html;
  window.scrollTo(0, 0);
}
function nav() {
  function b(id, label) { return '<button type="button" onclick="go(\'' + id + '\')"' + (S.tab === id && !S.sub ? ' aria-current="page"' : '') + '>' + I[id] + label + '</button>'; }
  return '<nav class="tabs" aria-label="Main"><div class="in">' + b('today', 'Today') + b('rules', 'Rules') + b('settings', 'Settings') + '</div></nav>';
}
function go(tab) { S.tab = tab; S.sub = null; render(); }
function topBar(title, backTo) { return '<div class="top"><button class="back" type="button" aria-label="Back" onclick="' + backTo + '">' + I.back + '</button><h1 style="font-size:22px">' + esc(title) + '</h1></div>'; }

/* ---------- Today ---------- */
function viewToday() {
  var d = S.d, c = d.counts, s = d.settings || {};
  var title = c.needs ? (c.needs + (c.needs === 1 ? ' needs you' : ' need you')) : 'Inbox is calm';
  var date = new Date().toLocaleDateString([], { weekday: 'long', month: 'short', day: 'numeric' });
  var h = '<header class="hero"><div class="row"><div><div class="eyebrow">' + esc(date) + '</div><h1>' + esc(title) + '</h1></div>' +
    '<button class="livebtn" type="button" onclick="toggleLive()" title="Off = test mode">' + (s.live ? 'Live' : 'Test') +
    '<span class="sw" role="switch" aria-checked="' + !!s.live + '" aria-label="Live mode for ' + esc(d.editing.label) + '"></span></button></div>';
  if (multi()) {
    h += '<div class="chips" role="tablist" aria-label="Account"><button class="chip" role="tab" aria-pressed="' + (S.view === 'all') + '" onclick="load(\'all\')">All' + (S.view === 'all' && c.needs ? ' · ' + c.needs : '') + '</button>';
    d.accounts.forEach(function (a, i) { h += '<button class="chip' + (a.error ? ' warn' : '') + '" role="tab" aria-pressed="' + (S.view === a.key) + '" onclick="loadAcct(' + i + ')">' + esc(a.label) + '</button>'; });
    h += '</div>';
  }
  h += '<div class="counts"><div><b class="hot">' + c.needs + '</b><span>need you</span></div><div><b>' + c.sorted + '</b><span>sorted today</span></div><div><b>' + c.cleared + '</b><span>cleared out</span></div></div></header>';
  h += '<main class="page"><section class="list" aria-labelledby="nh"><h2 id="nh">Needs you</h2>';
  if (!d.needs.length) h += '<div class="card empty">Nothing waiting on you.</div>';
  d.needs.forEach(function (n, i) {
    var label = n.alert ? 'ALERT · ' + n.from : (n.category ? n.category.toUpperCase() + ' · ' : '') + n.from;
    h += '<button type="button" class="card need' + (n.alert ? ' alert' : '') + '" onclick="openNeed(' + i + ')"><span class="bar"></span><span style="flex:1;min-width:0">' +
      '<span class="meta"><span>' + esc(label) + '</span><span class="r">' + (multi() ? '<span class="tag">' + esc(n.account) + '</span>' : '') + esc(when(n.when)) + '</span></span>' +
      '<span class="t">' + esc(n.subject) + '</span>' + (n.summary ? '<span class="s">' + esc(n.summary) + '</span>' : '') + '</span></button>';
  });
  h += '</section>';
  var cats = Object.keys(d.cleared);
  h += '<section class="list" aria-labelledby="ch"><h2 id="ch">Cleared out today</h2>';
  if (!cats.length) h += '<div class="note" style="text-align:left">Nothing archived yet today.</div>';
  else { h += '<div class="chips">'; catList().forEach(function (k, i) { h += '<button class="chip" style="background:var(--accent-soft);border-color:var(--accent-soft)" onclick="openCleared(' + i + ')"><b>' + d.cleared[k].length + '</b> ' + esc(k) + '</button>'; }); h += '</div>'; }
  h += '</section>';
  var own = S.view === 'all' || d.editing.own;
  h += '<div class="actions2" style="margin-top:auto"><button class="btn primary" type="button" onclick="checkNow(this)">Check now</button>' +
    (own ? '<button class="btn" type="button" onclick="digestNow(this)">Digest now</button>' : '') + '</div>';
  h += '<div class="note">' + esc(s.lastCheck || 'Checks every 10 minutes') + '</div></main>';
  return h;
}
function toggleLive() {
  var s = S.d.settings; var to = !s.live;
  call('appSetSetting', S.d.editing.key, 'DRY_RUN', to ? 'FALSE' : 'TRUE').then(function () { s.live = to; render(); toast(to ? S.d.editing.label + ' is live — it will act on mail.' : 'Test mode — it only logs what it would do.'); }).catch(fail);
}
function openNeed(i) {
  var n = S.d.needs[i];
  if ((S.d.settings || {}).tapAction === 'gmail') { window.open(n.link, '_blank'); return; }
  S.sub = 'email'; S.email = { loading: true, n: n }; render();
  call('appEmail', n.acct, n.id).then(function (e) { S.email = { e: e, n: n }; if (S.sub === 'email') render(); }).catch(function (e) { S.email = { n: n, err: e.message }; render(); });
}
function checkNow(btn) { btn.disabled = true; btn.textContent = 'Checking…'; call('appCheckNow', S.view === 'all' ? 'self' : S.view).then(function (m) { toast(m); return load(); }).catch(fail).then(function () { btn.disabled = false; }); }
function digestNow(btn) { btn.disabled = true; call('appSendDigestNow').then(toast).catch(fail).then(function () { btn.disabled = false; }); }

/* ---------- Email ---------- */
function viewEmail() {
  var x = S.email || {}, n = x.n || {}, e = x.e;
  var h = '<div class="top"><button class="back" type="button" aria-label="Back to Today" onclick="go(\'today\')">' + I.back + '</button><span style="flex:1;font-size:13px;color:var(--muted)">Needs you</span>' + (multi() ? '<span class="tag">' + esc(n.account) + '</span>' : '') + '</div><main class="page" style="padding-bottom:20px">';
  h += '<div><div style="font-size:12px;font-weight:600;color:' + (n.alert ? 'var(--alert-ink)' : 'var(--accent)') + '">' + (n.alert ? 'ALERT' : esc((n.category || 'NEEDS YOU').toUpperCase())) + '</div><h1 style="font-size:22px;line-height:1.25;margin-top:4px">' + esc(n.subject) + '</h1></div>';
  var from = e ? e.from : n.from;
  h += '<div style="display:flex;align-items:center;gap:10px"><span class="avatar">' + esc(String(from || '?').replace(/^["\s]+/, '').charAt(0).toUpperCase()) + '</span><div style="flex:1;min-width:0"><div style="font-weight:600;font-size:14px;overflow-wrap:anywhere">' + esc(from) + '</div><div style="font-size:12px;color:var(--muted)">' + esc(when(e ? e.date : n.when)) + '</div></div></div>';
  if (x.loading) h += '<div class="card mail" style="color:var(--muted)">Loading…</div>';
  else if (x.err) h += '<div class="card mail">' + esc(x.err) + '</div>';
  else if (e && e.own && e.body) h += '<div class="card mail">' + esc(e.body) + '</div>';
  else h += '<div class="card mail"><b>Summary:</b> ' + esc((e && e.summary) || n.summary || '') + '\n\n<span style="color:var(--muted)">This email is in your ' + esc(n.account) + ' account. Open it in Gmail to read the whole thing.</span></div>';
  h += '</main><div class="dock"><div class="three">' +
    '<button class="btn primary" type="button" onclick="mailAct(\'done\')">' + I.check + 'Done</button>' +
    '<button class="btn" type="button" onclick="mailAct(\'archive\')">' + I.box + 'Archive</button>' +
    '<button class="btn" type="button" onclick="mailAct(\'star\')">' + I.star + ((e && e.starred) ? 'Unstar' : 'Star') + '</button></div>' +
    '<a class="btn soft small" href="' + esc(n.link) + '" target="_blank" rel="noopener">Reply in Gmail ' + I.out + '</a></div>';
  return h;
}
function mailAct(a) {
  var n = S.email.n;
  call('appEmailAction', n.acct, n.id, a).then(function (m) { toast(m); if (a === 'star') { if (S.email.e) S.email.e.starred = !S.email.e.starred; render(); return; } S.sub = null; S.tab = 'today'; return load(); }).catch(fail);
}

/* ---------- Cleared ---------- */
function openCleared(i) { S.sub = 'cleared'; S.cleared = catList()[i]; render(); }
function viewCleared() {
  var d = S.d, cats = catList(), cur = S.cleared || cats[0];
  var h = topBar('Cleared out today', "go('today')") + '<main class="page"><div class="chips">';
  cats.forEach(function (k, i) { h += '<button class="chip" aria-pressed="' + (k === cur) + '" onclick="openCleared(' + i + ')">' + esc(k) + ' · ' + d.cleared[k].length + '</button>'; });
  h += '</div><div class="card group">';
  (d.cleared[cur] || []).forEach(function (x) {
    h += '<a class="item" href="' + esc(x.link) + '" target="_blank" rel="noopener" style="text-decoration:none;color:inherit"><span class="lbl"><b style="font-size:15px">' + esc(x.subject) + '</b><span>' + esc(x.from) + (multi() ? ' · ' + esc(x.account) : '') + '</span></span><span style="font-size:12px;color:var(--faint)">' + esc(when(x.when)) + '</span></a>';
  });
  h += '</div><div class="note">Archived, not deleted · tap any to open it in Gmail</div>' +
    '<div class="card" style="border-style:dashed;padding:12px 14px;display:flex;align-items:center;gap:10px"><span style="flex:1;font-size:14px">Something here you wanted to keep?</span><button class="btn soft small" style="flex:none" onclick="S.sub=\'write\';render()">Write a rule</button></div></main>';
  return h;
}

/* ---------- Rules ---------- */
function editChips(withAll) {
  if (!multi()) return '';
  var h = '<div class="chips" aria-label="Account">';
  S.d.accounts.forEach(function (a, i) { if (a.error) return; h += '<button class="chip" aria-pressed="' + (S.d.editing.key === a.key) + '" onclick="loadAcct(' + i + ')">' + esc(a.label) + '</button>'; });
  return h + '</div>';
}
function viewRules() {
  var d = S.d, on = d.rules.filter(function (r) { return r.on; }), off = d.rules.filter(function (r) { return !r.on; });
  var h = '<div class="top" style="flex-direction:column;align-items:stretch;gap:10px"><div style="display:flex;align-items:baseline;justify-content:space-between"><h1>Rules</h1><span style="font-size:13px;color:var(--muted)">' + on.length + ' active' + (multi() ? ' · ' + esc(d.editing.label) : '') + '</span></div>' + editChips() +
    '<div class="chips" aria-label="Show"><button class="chip" aria-pressed="' + (S.filter === 'active') + '" onclick="setFilter(\'active\')">Active · ' + on.length + '</button>' +
    (off.length ? '<button class="chip" aria-pressed="' + (S.filter === 'off') + '" onclick="setFilter(\'off\')">Off · ' + off.length + '</button>' : '');
  d.library.forEach(function (g, gi) { h += '<button class="chip" aria-pressed="' + (S.filter === 'lib' + gi) + '" onclick="setFilter(\'lib' + gi + '\')">' + esc(g.type) + '</button>'; });
  h += '</div></div><main class="page" style="padding-top:6px"><div class="list">';
  if (S.filter === 'active' || S.filter === 'off') {
    var list = S.filter === 'active' ? on : off;
    if (!list.length) h += '<div class="card empty">' + (S.filter === 'active' ? 'No rules on yet. Pick some from the account types above.' : 'No rules are off.') + '</div>';
    list.forEach(function (r) {
      var idx = d.rules.indexOf(r);
      h += '<div class="card rule' + (r.on ? '' : ' off') + '"><div style="flex:1"><div class="k">' + esc(r.type ? r.type : 'Your rule') + (r.on ? '' : ' · off') + '</div><div class="x">' + esc(r.text) + '</div>' +
        (r.on ? '' : '<button class="linkbtn" onclick="removeRule(' + idx + ')">Remove</button>') + '</div>' +
        '<button class="sw" role="switch" aria-checked="' + r.on + '" aria-label="' + (r.on ? 'Turn off' : 'Turn on') + '" onclick="toggleRule(' + idx + ')"></button></div>';
    });
  } else {
    var gi = Number(String(S.filter).slice(3)), g = d.library[gi];
    (g ? g.rules : []).forEach(function (r, i) {
      h += '<div class="card rule"><div style="flex:1"><div class="k">' + esc(g.type) + '</div><div class="x">' + esc(r.text) + '</div></div>' +
        '<button class="addbtn" aria-pressed="' + r.added + '" onclick="libToggle(' + gi + ',' + i + ')">' + (r.added ? 'Added ✓' : 'Add') + '</button></div>';
    });
  }
  h += '</div><button class="btn primary" style="flex:none;margin-top:4px" onclick="S.sub=\'write\';render()">' + I.plus + 'Write a rule</button></main>';
  return h;
}
function setFilter(f) { S.filter = f; render(); }
function toggleRule(i) { var r = S.d.rules[i]; r.on = !r.on; render(); call('appRuleSet', S.d.editing.key, r.text, r.on).catch(function (e) { r.on = !r.on; render(); fail(e); }); }
function removeRule(i) { var r = S.d.rules[i]; call('appRuleRemove', S.d.editing.key, r.text).then(function () { toast('Removed.'); return load(); }).catch(fail); }
function libToggle(gi, i) {
  var g = S.d.library[gi], r = g.rules[i];
  var p = r.added ? call('appRuleRemove', S.d.editing.key, r.text) : call('appRuleAdd', S.d.editing.key, r.text);
  r.added = !r.added; render();
  p.then(function () { return load(); }).catch(function (e) { r.added = !r.added; render(); fail(e); });
}

/* ---------- Write a rule ---------- */
function viewWrite() {
  return topBar('Write a rule', "S.sub=null;render()") + '<main class="page">' +
    '<div><label class="f" for="rule">In plain English, what should happen?</label><textarea class="input" id="rule" maxlength="500" placeholder="e.g. Alert me about anything from my landlord, and keep it in the inbox."></textarea></div>' +
    '<div class="chips" aria-label="Ideas"><button class="chip" onclick="idea(\'Label anything from … as “…” and keep it in the inbox.\')">Label anything from …</button><button class="chip" onclick="idea(\'Archive … after 2 days.\')">Archive … after 2 days</button><button class="chip" onclick="idea(\'Leave … alone.\')">Leave … alone</button><button class="chip" onclick="idea(\'Alert me right away about …\')">Alert me about …</button></div>' +
    (multi() ? '<div class="note" style="text-align:left">Adds to ' + esc(S.d.editing.label) + '.</div>' : '') +
    '<div style="margin-top:auto;display:flex;flex-direction:column;gap:8px"><button class="btn primary" style="flex:none" id="addrule" onclick="addRule()">Add rule</button><div class="note">Applies to new mail from the next check.</div></div></main>';
}
function idea(t) { var el = document.getElementById('rule'); el.value = t; el.focus(); var p = t.indexOf('…'); if (p >= 0) el.setSelectionRange(p, p + 1); }
function addRule() {
  var t = document.getElementById('rule').value.trim(), b = document.getElementById('addrule');
  if (t.length < 8) { toast('Write the rule as a short sentence.'); return; }
  b.disabled = true;
  call('appRuleAdd', S.d.editing.key, t).then(function () { toast('Rule added.'); S.sub = null; S.tab = 'rules'; S.filter = 'active'; return load(); }).catch(function (e) { b.disabled = false; fail(e); });
}

/* ---------- Settings ---------- */
function viewSettings() {
  var d = S.d, s = d.settings || {}, self = d.self;
  var hours = [6, 7, 8, 12, 17, 20]; (s.digestHours || []).forEach(function (x) { if (hours.indexOf(x) < 0) hours.push(x); }); hours.sort(function (a, b) { return a - b; });
  var h = '<div class="top" style="flex-direction:column;align-items:stretch;gap:10px"><h1>Settings</h1>' + editChips() + '</div><main class="page" style="padding-top:6px">';
  h += '<div class="card group"><div class="item"><div class="lbl"><b>Live</b><span>Off = test mode: only logs what it would do.</span></div><button class="sw" role="switch" aria-checked="' + !!s.live + '" aria-label="Live" onclick="toggleLive()"></button></div>';
  if (s.sendsDigest) {
    h += '<div class="block"><b style="font-weight:600">Digest times</b><div class="chips" style="margin-top:8px">';
    hours.forEach(function (x) { h += '<button class="chip" aria-pressed="' + ((s.digestHours || []).indexOf(x) >= 0) + '" onclick="toggleHour(' + x + ')">' + hourLabel(x) + '</button>'; });
    h += '</div></div>';
  } else {
    h += '<div class="item"><div class="lbl"><b>Digest</b><span>Included in ' + esc(s.mainAccount || 'your main account') + '\'s digest.</span></div></div>';
  }
  h += '<div class="item"><div class="lbl"><b>Gemini key</b><span>' + (s.keySaved ? 'Saved privately ✓' : 'Not set yet — the assistant can\'t sort mail without it.') + '</span></div><button class="linkbtn" onclick="S.sub=\'key\';render()">' + (s.keySaved ? 'Replace' : 'Add') + '</button></div>';
  h += '<div class="block"><b style="font-weight:600">When I tap an email</b><div class="seg" role="radiogroup" aria-label="When I tap an email">' +
    '<button role="radio" aria-checked="' + (s.tapAction !== 'gmail') + '" onclick="setTap(\'app\')">Show it here</button><button role="radio" aria-checked="' + (s.tapAction === 'gmail') + '" onclick="setTap(\'gmail\')">Open in Gmail</button></div></div>';
  h += '<div class="item"><div class="lbl"><b>Archive read mail after</b><span>Starred and “needs you” stay. 0 = never.</span></div><div class="stepper"><button aria-label="Fewer days" onclick="stepDays(-1)">−</button><span>' + (s.archiveDays ? s.archiveDays + (s.archiveDays === 1 ? ' day' : ' days') : 'Never') + '</span><button aria-label="More days" onclick="stepDays(1)">+</button></div></div></div>';

  h += '<section class="list"><h2>Accounts</h2><div class="card group">';
  d.accounts.forEach(function (a) {
    h += '<div class="item"><span class="dot' + (a.error ? ' bad' : '') + '"></span><div class="lbl"><b>' + esc(a.label) + '</b><span>' + esc(a.error || (a.own ? 'This account' : a.email + ' · linked')) + '</span></div>' +
      (a.error ? '' : '<button class="linkbtn" onclick="manage(' + d.accounts.indexOf(a) + ')">Manage</button>') + '</div>';
  });
  h += '<button class="item" style="width:100%;border:0;background:none;color:var(--accent);font-weight:600;min-height:48px" onclick="openLink()">' + I.plus + 'Link another account</button>';
  h += '<button class="item" style="width:100%;border:0;border-top:1px solid var(--line-2);background:none;color:var(--accent);font-weight:600;min-height:48px" onclick="S.sub=\'join\';render()">Join a main account</button></div></section>';

  if (!self.library) {
    h += '<section class="list"><h2>Updates</h2><div class="card group"><div class="item"><div class="lbl"><b>Install updates automatically</b><span>Version ' + esc(self.version) + '</span></div><button class="sw" role="switch" aria-checked="' + !!s.autoUpdate + '" aria-label="Automatic updates" onclick="toggleAuto()"></button></div>' +
      (self.lastUpdate ? '<div class="block" style="font-size:13px;color:var(--muted)">' + esc(self.lastUpdate) + '</div>' : '') +
      '<div class="block" style="display:flex;gap:8px"><button class="btn small" onclick="updNow(this)">Check for update</button><button class="btn small" onclick="undoUpd(this)">Undo last update</button></div></div></section>';
  }
  h += '<a class="btn small" style="flex:none" href="' + esc(self.sheetUrl) + '" target="_blank" rel="noopener">Open my sheet ' + I.out + '</a></main>';
  return h;
}
function setSetting(k, v, msg) { return call('appSetSetting', S.d.editing.key, k, v).then(function () { if (msg) toast(msg); return load(); }).catch(fail); }
function toggleHour(x) {
  var cur = (S.d.settings.digestHours || []).slice(), i = cur.indexOf(x);
  if (i >= 0) { if (cur.length === 1) { toast('Keep at least one digest time.'); return; } cur.splice(i, 1); } else cur.push(x);
  S.d.settings.digestHours = cur.sort(function (a, b) { return a - b; }); render();
  setSetting('DIGEST_HOUR', cur.join(','), 'Digest times saved. They take effect within 10 minutes.');
}
function setTap(v) { S.d.settings.tapAction = v; render(); setSetting('TAP_ACTION', v); }
function stepDays(n) { var v = Math.max(0, Math.min(60, (S.d.settings.archiveDays || 0) + n)); S.d.settings.archiveDays = v; render(); clearTimeout(stepDays.h); stepDays.h = setTimeout(function () { setSetting('ARCHIVE_READ_AFTER_DAYS', v); }, 600); }
function toggleAuto() { var v = !S.d.settings.autoUpdate; S.d.settings.autoUpdate = v; render(); setSetting('AUTO_UPDATE', v ? 'TRUE' : 'FALSE'); }
function updNow(b) { b.disabled = true; b.textContent = 'Checking…'; call('appUpdateNow').then(function (m) { toast(m); return load(); }).catch(fail); }
function undoUpd(b) { b.disabled = true; call('appUndoUpdate').then(function (m) { toast(m); return load(); }).catch(fail); }

/* ---------- Gemini key ---------- */
function viewKey() {
  return topBar('Gemini key', "S.sub=null;S.tab='settings';render()") + '<main class="page">' +
    '<p style="margin:0;font-size:14px;color:var(--muted)">Get a key at <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a>. It\'s stored privately in ' + esc(S.d.editing.label) + '\'s Google account and never shown again, not in the app and not in the sheet.</p>' +
    '<div><label class="f" for="gk">New key</label><input class="input" id="gk" type="password" autocomplete="off" spellcheck="false" placeholder="Paste your key"></div>' +
    '<button class="btn primary" style="flex:none" id="gkb" onclick="saveKey()">Save key</button>' +
    '<div class="note" style="text-align:left">Tip: turn on billing for the key in AI Studio (about $0–2 a month) so Google doesn\'t use your email text to improve its products.</div></main>';
}
function saveKey() {
  var el = document.getElementById('gk'), b = document.getElementById('gkb');
  b.disabled = true;
  call('appSetKey', S.d.editing.key, el.value).then(function (m) { el.value = ''; toast(m); S.sub = null; S.tab = 'settings'; return load(); }).catch(function (e) { b.disabled = false; fail(e); });
}

/* ---------- Manage / link / join ---------- */
function manage(i) { S.edit = S.d.accounts[i]; S.sub = 'manage'; render(); }
function viewManage() {
  var a = S.edit || {};
  return topBar(a.label || 'Account', "S.sub=null;render()") + '<main class="page"><div><label class="f" for="lbl">Name in the app and digest</label><input class="input" id="lbl" maxlength="24" value="' + esc(a.label) + '"></div>' +
    '<div class="note" style="text-align:left">' + esc(a.email) + '</div><button class="btn primary" style="flex:none" onclick="saveLabel()">Save name</button>' +
    (a.own ? '' : '<button class="btn" style="flex:none;color:var(--alert-ink)" onclick="unlink()">Unlink this account</button><div class="note" style="text-align:left">Unlinking only removes it from this app and your digest. It keeps sorting its own mail.</div>') + '</main>';
}
function saveLabel() { var v = document.getElementById('lbl').value.trim(); if (!v) return; call('appSetSetting', S.edit.key, 'ACCOUNT_LABEL', v).then(function () { toast('Saved.'); S.sub = null; return load(); }).catch(fail); }
function unlink() { call('appUnlink', S.edit.key).then(function (m) { toast(m); S.sub = null; return load('all'); }).catch(fail); }
function openLink() {
  S.sub = 'link'; S.link = S.d.self.linkCode ? { code: S.d.self.linkCode.code, email: S.d.me } : null; render();
  if (!S.link) call('appLinkCode').then(function (r) { S.link = r; if (S.sub === 'link') render(); }).catch(fail);
}
function viewLink() {
  var L = S.link;
  return topBar('Link an account', "S.sub=null;S.tab='settings';render()") + '<main class="page">' +
    '<p style="margin:0;font-size:14px;color:var(--muted)">See every inbox here and get one digest. Each account keeps sorting its own mail.</p>' +
    '<div class="codecard"><div class="eyebrow">Step 1 · on this account</div><div style="font-size:14px">Your link code</div><div class="code">' + (L ? esc(L.code) : '·······') + '</div>' +
    '<div style="display:flex;gap:8px;align-items:center"><button class="btn small" style="flex:none;background:var(--mint);border-color:var(--mint);color:#0b2224" onclick="copyCode()">Copy code</button><span style="font-size:13px;color:var(--head-muted)">Works for 1 hour</span></div></div>' +
    '<div class="card" style="padding:16px;display:flex;flex-direction:column;gap:10px"><div class="eyebrow" style="color:var(--muted);font-weight:600">Step 2 · on the other account</div>' +
    '<ol style="margin:0;padding-left:20px;font-size:14px;display:flex;flex-direction:column;gap:4px"><li>Open its Inbox Assistant app.</li><li>Settings → <b>Join a main account</b>.</li><li>Enter <b>' + esc(S.d.me) + '</b> and this code.</li></ol>' +
    '<div style="font-size:13px;color:var(--muted);background:var(--ground);border-radius:10px;padding:10px 12px">It shares its sheet with this account, sends its alerts here, and turns off its own digest.</div></div>' +
    '<button class="btn soft" style="flex:none" onclick="load()">Check if it\'s linked</button><div class="note">Linking finishes within about 10 minutes of joining.</div></main>';
}
function copyCode() { var c = S.link && S.link.code; if (!c) return; (navigator.clipboard ? navigator.clipboard.writeText(c) : Promise.reject()).then(function () { toast('Copied ' + c); }, function () { toast('Code: ' + c); }); }
function viewJoin() {
  return topBar('Join a main account', "S.sub=null;S.tab='settings';render()") + '<main class="page">' +
    '<p style="margin:0;font-size:14px;color:var(--muted)">Use this on an extra account to add it to your main account\'s app and digest. Get the code from the main account: Settings → Link another account.</p>' +
    '<div><label class="f" for="me">Main account\'s email</label><input class="input" id="me" type="email" autocomplete="email" placeholder="you@gmail.com"></div>' +
    '<div><label class="f" for="cd">Link code</label><input class="input" id="cd" autocapitalize="characters" placeholder="K7P-42Q" style="font-family:var(--display);letter-spacing:.1em;font-size:20px"></div>' +
    '<button class="btn primary" style="flex:none" id="jb" onclick="join()">Link to main account</button><div class="note">This account keeps sorting its own mail. Its digest and alerts go to the main account.</div></main>';
}
function join() {
  var b = document.getElementById('jb'); b.disabled = true;
  call('appJoinMain', document.getElementById('me').value, document.getElementById('cd').value).then(function (m) { toast(m); S.sub = null; S.tab = 'settings'; return load(); }).catch(function (e) { b.disabled = false; fail(e); });
}

load();
</script>
</body>
</html>
